server {
    listen 443 ssl;
    server_name daily-tasks-app.hyt-apps.com;

    ssl_certificate /etc/letsencrypt/live/daily-tasks-app.hyt-apps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daily-tasks-app.hyt-apps.com/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ /index.php?$query_string;
    }
}

server {
    listen 80;
    server_name daily-tasks-app.hyt-apps.com;
    return 301 https://$host$request_uri;
}
